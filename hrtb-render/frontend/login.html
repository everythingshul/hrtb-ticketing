<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a3a6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EShul Tickets">
<link rel="icon" type="image/x-icon" href="/favicon.ico"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mamudem — Mamudem Login</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .role-picker { display:none; }
  .role-card {
    display:flex; align-items:center; gap:14px;
    padding:14px 16px; background:var(--bg3);
    border:1.5px solid var(--border); border-radius:var(--r-lg);
    cursor:pointer; margin-bottom:9px; transition:all .15s;
  }
  .role-card:hover { border-color:var(--cyan); background:var(--bg4); }
  .role-card .rico { font-size:22px; }
  .role-card .rname { font-size:14px; font-weight:600; }
  .role-card .rdesc { font-size:12px; color:var(--text2); margin-top:2px; }
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo" style="margin-bottom:28px">
      <img src="/logo.png" alt="Mamudem" style="width:220px;height:auto;display:block;margin:0 auto 14px;filter:drop-shadow(0 2px 8px rgba(255,255,255,0.9)) drop-shadow(0 0 16px rgba(255,255,255,0.7))">
      <p style="font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--text3)">Mamudem</p>
    </div>

    <!-- Login form -->
    <div class="auth-card" id="login-form">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to manage your events</p>
      <div id="err" style="display:none" class="info-box warn mb16"></div>
      <div class="fg"><label>Email</label><input id="email" type="email" placeholder="you@example.com" autofocus></div>
      <div class="fg"><label>Password</label><input id="pass" type="password" placeholder="••••••••"></div>
      <button class="btn btn-gold" style="width:100%;justify-content:center;padding:11px;margin-top:4px" onclick="login()">Sign in →</button>
      <div id="google-section" style="display:none">
        <div style="display:flex;align-items:center;gap:10px;margin:14px 0"><div style="flex:1;height:1px;background:var(--border)"></div><span style="font-size:11px;color:var(--text2);flex-shrink:0">or</span><div style="flex:1;height:1px;background:var(--border)"></div></div>
        <div id="google-btn-login" style="display:flex;justify-content:center;min-height:44px"></div>
      </div>
    </div>

    <!-- Dual-role picker (shown when user has multiple roles) -->
    <div class="auth-card role-picker" id="role-picker">
      <h2>Choose your role</h2>
      <p class="sub" style="margin-bottom:18px">You have access in multiple capacities. Which would you like to use now?</p>
      <div id="role-options"></div>
    </div>

    <div class="auth-foot">New here? <a href="/signup.html">Create free account</a> &nbsp;·&nbsp; <a href="/">Learn more</a></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  if (Auth.token()) window.location = '/dashboard.html';
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('login-form').style.display !== 'none') login(); });

  // Show message if logged out due to role change
  const msg = sessionStorage.getItem('hrtb_logout_msg');
  if (msg) {
    const err = document.getElementById('err');
    err.textContent = msg;
    err.className = 'info-box tip mb16';
    err.style.display = 'block';
    sessionStorage.removeItem('hrtb_logout_msg');
  }

  let pendingLoginData = null;

  async function login() {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    const err = document.getElementById('err');
    err.style.display = 'none';
    if (!email || !pass) { err.textContent = 'Enter your email and password'; err.style.display = 'block'; return; }
    try {
      const data = await api.auth.login({ email, password: pass });
      pendingLoginData = data;

      // Check if user has multiple roles (dual-role)
      const choices = buildRoleChoices(data);
      if (choices.length > 1) {
        showRolePicker(choices, data);
      } else {
        completeLogin(data);
      }
    } catch(e) { err.textContent = e.message; err.style.display = 'block'; }
  }

  function buildRoleChoices(data) {
    const { user, memberships = [] } = data;
    const choices = [];

    // Own admin/user role
    if (user.role === 'admin') {
      choices.push({ type: 'system', label: 'System Admin', desc: 'Full access to all accounts and settings', icon: '', role: 'admin' });
    } else if (!memberships.length) {
      choices.push({ type: 'own', label: 'My Account', desc: 'Access your events', icon: '', role: 'user' });
    }

    // Each membership (they're a member of someone else's account)
    for (const m of memberships) {
      choices.push({
        type: 'member',
        label: m.account_name,
        desc: `${m.member_role === 'owner' ? 'Owner' : 'Member'} of this account`,
        icon: m.member_role === 'owner' ? '' : '',
        accountId: m.account_id,
        role: m.member_role
      });
    }

    // Also show own account if they have memberships too
    if (memberships.length && user.role !== 'admin') {
      choices.unshift({ type: 'own', label: 'My Own Events', desc: 'Access events under your own account', icon: '', role: 'user' });
    }

    return choices;
  }

  function showRolePicker(choices, data) {
    document.getElementById('login-form').style.display = 'none';
    const picker = document.getElementById('role-picker');
    picker.style.display = 'block';
    document.getElementById('role-options').innerHTML = choices.map((c, i) => `
      <div class="role-card" onclick="selectRole(${i})">
        <div class="rico">${c.icon}</div>
        <div>
          <div class="rname">${esc(c.label)}</div>
          <div class="rdesc">${esc(c.desc)}</div>
        </div>
      </div>`).join('');
    picker.choices = choices;
  }

  function selectRole(idx) {
    const choice = document.getElementById('role-picker').choices[idx];
    // Store selected context
    if (choice.accountId) {
      localStorage.setItem('hrtb_context_account', choice.accountId);
    } else {
      localStorage.removeItem('hrtb_context_account');
    }
    completeLogin(pendingLoginData);
  }

  function completeLogin(data) {
    Auth.set(data.token, data.user);
    // Store memberships for account switcher
    const memberships = (data.memberships || []).map(m => ({
      accountId: m.account_id,
      accountName: m.account_name,
      role: m.member_role
    }));
    localStorage.setItem('hrtb_memberships', JSON.stringify(memberships));
    window.location = '/dashboard.html';
  }
</script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
// Google Sign-In — initializes once GSI library is ready
let _googleInitAttempts = 0;
function initGoogleLogin(clientId) {
  if (!clientId) return;
  _googleInitAttempts++;
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
    if (_googleInitAttempts < 50) setTimeout(() => initGoogleLogin(clientId), 200);
    return;
  }
  try {
    google.accounts.id.initialize({
      client_id: clientId,
      callback: handleGoogleLogin,
      auto_select: false,
      cancel_on_tap_outside: true,
    });
    const section = document.getElementById('google-section');
    const btn = document.getElementById('google-btn-login');
    if (section) section.style.display = 'block';
    if (btn) {
      google.accounts.id.renderButton(btn, {
        theme: 'outline', size: 'large', width: 300,
        text: 'signin_with', shape: 'rectangular'
      });
    }
  } catch(e) { console.warn('[google-login]', e); }
}

fetch('/api/auth/google-client-id')
  .then(r => r.json())
  .then(d => { if (d.clientId) initGoogleLogin(d.clientId); })
  .catch(() => {});

async function handleGoogleLogin(response) {
  const errEl = document.getElementById('err');
  try {
    const r = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential })
    });
    const d = await r.json();
    if (d.error) { errEl.textContent = d.error; errEl.style.display = 'block'; return; }
    Auth.set(d.token, d.user);
    window.location = d.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
  } catch(e) {
    errEl.textContent = 'Google sign-in failed. Please try again.';
    errEl.style.display = 'block';
  }
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
// Show install prompt if not already installed/dismissed
(function(){
  if(localStorage.getItem('pwa-dismissed')) return;
  if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return;
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  let _p=null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); _p=e;
    if(document.getElementById('pwa-mini')) document.getElementById('pwa-mini').style.display='flex';
  });
  if(isIos && isSafari && document.getElementById('pwa-mini')) {
    document.getElementById('pwa-mini').style.display='flex';
  }
  window.pwaInstallMini = async function(){
    if(_p){_p.prompt();const{outcome}=await _p.userChoice;_p=null;if(outcome==='accepted')localStorage.setItem('pwa-dismissed','1');}
    if(document.getElementById('pwa-mini')) document.getElementById('pwa-mini').style.display='none';
  };
})();
</script>
</body>
</html>
