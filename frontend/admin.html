<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="page">

    <div class="ph mb16">
      <div class="ph-left"><h1>Admin Dashboard</h1></div>
    </div>

    <div id="stats" class="stat-pills mb24"></div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
      <a href="/admin-accounts.html" class="card" style="text-decoration:none;padding:20px;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--border);border-radius:var(--r-lg);transition:all .15s;cursor:pointer" onmouseover="this.style.borderColor='var(--navy)'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="font-size:24px"></div>
        <div style="font-weight:700;color:var(--navy)">Accounts</div>
        <div class="text2 sm">Manage user accounts, permissions, SMS/IVR numbers</div>
      </a>
      <a href="/admin-events.html" class="card" style="text-decoration:none;padding:20px;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--border);border-radius:var(--r-lg);transition:all .15s" onmouseover="this.style.borderColor='var(--navy)'" onmouseout="this.style.borderColor='var(--border)'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="1.8"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2z"/><path d="M13 5v14M9 5v14"/></svg>
        <div style="font-weight:700;color:var(--navy)">All Events</div>
        <div class="text2 sm">View and manage all events across all accounts</div>
      </a>
      <a href="/admin-content.html" class="card" style="text-decoration:none;padding:20px;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--border);border-radius:var(--r-lg);transition:all .15s" onmouseover="this.style.borderColor='var(--navy)'" onmouseout="this.style.borderColor='var(--border)'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <div style="font-weight:700;color:var(--navy)">Site Content</div>
        <div class="text2 sm">Edit public pages, pricing, SMS/IVR messages, PCI data</div>
      </a>
      <a href="/admin-backup.html" class="card" style="text-decoration:none;padding:20px;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--border);border-radius:var(--r-lg);transition:all .15s" onmouseover="this.style.borderColor='var(--navy)'" onmouseout="this.style.borderColor='var(--border)'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="1.8"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        <div style="font-weight:700;color:var(--navy)">Backup &amp; Trash</div>
        <div class="text2 sm">Database backup, restore, maintenance mode, deleted items</div>
      </a>
    </div>

  </div></main>
</div>
<script src="/js/app.js"></script>
<script>
if (!Auth.require()) throw 0;
if (!Auth.requireAdmin()) throw 0;
renderSidebar();

api.admin.stats().then(d => {
  const s = d.stats;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Accounts</div><div class="stat-val">${s.accounts||0}</div></div>
    <div class="stat"><div class="stat-label">Events</div><div class="stat-val">${s.events||0}</div></div>
    <div class="stat"><div class="stat-label">Attendees</div><div class="stat-val">${s.attendees||0}</div></div>
    <div class="stat"><div class="stat-label">Checked In</div><div class="stat-val green">${s.checkedIn||0}</div></div>
    <div class="stat"><div class="stat-label">Sent</div><div class="stat-val blue">${s.sent||0}</div></div>`;
}).catch(e => { document.getElementById('stats').innerHTML = `<div class="info-box warn">${e.message}</div>`; });
</script>
</body>
</html>
