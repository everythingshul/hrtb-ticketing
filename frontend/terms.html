<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terms and Conditions — EverythingShul</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a3a6b;--gold:#c8960c;--bg:#f8fafc;--text:#1a1a2e;--text2:#4a5568;--border:#e2e8f0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--navy);text-decoration:none}
nav{background:var(--navy);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:10px}.nav-logo img{height:32px}.nav-logo span{color:#fff;font-size:14px;font-weight:600;opacity:.8}
.nav-links{display:flex;align-items:center;gap:8px}
.nav-links a{color:rgba(255,255,255,.8);font-size:13px;padding:7px 14px;border-radius:6px;font-weight:500}
.nav-links a:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-links .btn-gold{background:var(--gold);color:#000;font-weight:700;padding:8px 18px;border-radius:8px}
.hero{background:var(--navy);color:#fff;padding:48px 24px 40px;text-align:center}
.hero h1{font-size:clamp(20px,3vw,36px);font-weight:800;margin-bottom:8px}
.hero p{color:rgba(255,255,255,.6);font-size:13px}
.content{max-width:760px;margin:48px auto;padding:0 24px 60px}
.content-body h2{font-size:18px;font-weight:700;color:var(--navy);margin:28px 0 10px}
.content-body h2:first-child{margin-top:0}
.content-body p{font-size:14px;line-height:1.75;color:var(--text2);margin-bottom:12px}
.content-body a{color:var(--navy);text-decoration:underline}
.content-body ul,.content-body ol{padding-left:20px;margin-bottom:12px}
.content-body li{font-size:14px;line-height:1.75;color:var(--text2)}
footer{background:#0d2454;color:rgba(255,255,255,.5);padding:24px;text-align:center;font-size:12px}
footer a{color:rgba(255,255,255,.6);margin:0 8px}
</style>
</head>
<body>
<nav>
  <div class="nav-logo"><img src="/logo.png" alt="EverythingShul"><span>Ticket System</span></div>
  <div class="nav-links">
    <a href="/landing.html">Home</a>
    <a href="/pricing.html">Pricing</a>
    <a href="/faq.html">FAQ</a>
    <a href="/signup.html" class="btn-gold">Get Started →</a>
  </div>
</nav>
<div class="hero">
  <h1 id="terms-title">Terms and Conditions</h1>
  <p id="terms-updated"></p>
</div>
<div class="content">
  <div class="content-body" id="terms-body">Loading…</div>
</div>
<footer>
  <a href="/landing.html">Home</a><a href="/pricing.html">Pricing</a><a href="/faq.html">FAQ</a><a href="/index.html">Sign In</a>
  <div style="margin-top:8px">&copy; 2025 EverythingShul.com</div>
</footer>
<script>
fetch('/api/admin/site-content').then(r=>r.json()).then(({ content: c }) => {
  document.getElementById('terms-title').textContent = c['terms.title'] || 'Terms and Conditions';
  document.title = (c['terms.title'] || 'Terms and Conditions') + ' — EverythingShul';
  if (c['terms.last_updated']) document.getElementById('terms-updated').textContent = 'Last updated: ' + c['terms.last_updated'];
  document.getElementById('terms-body').innerHTML = c['terms.content'] || '<p>Terms not yet configured. Check back soon.</p>';
}).catch(() => {
  document.getElementById('terms-body').textContent = 'Could not load terms. Please try again.';
});
</script>
</body>
</html>
