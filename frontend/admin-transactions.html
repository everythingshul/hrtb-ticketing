<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticket Transactions — Admin</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="page">

    <div class="ph mb16">
      <div class="ph-left"><h1>Ticket Transactions</h1><p class="text2 sm">Every ticket purchase — online, portal, IVR, SMS.</p></div>
    </div>

    <!-- Filters -->
    <div class="card mb16" style="padding:12px 16px">
      <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="fg" style="margin:0;min-width:200px"><label style="font-size:11px">Search</label>
          <input id="f-q" placeholder="Name, email, ticket ID…" oninput="delayLoad()" autocomplete="off"></div>
        <div class="fg" style="margin:0"><label style="font-size:11px">Channel</label>
          <select id="f-channel" onchange="load()">
            <option value="">All Channels</option>
            <option value="online">Online</option>
            <option value="phone">Phone / SMS</option>
            <option value="portal">Portal (manual)</option>
          </select></div>
        <div class="fg" style="margin:0"><label style="font-size:11px">Event</label>
          <select id="f-event" onchange="load()"><option value="">All Events</option></select></div>
        <button class="btn btn-sm btn-ghost" onclick="clearFilters()">Clear</button>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="stat-pills mb16" id="stats"></div>

    <!-- Table -->
    <div id="wrap"><div class="text2 sm">Loading…</div></div>

    <!-- Pagination -->
    <div id="pager" class="row mt12" style="gap:8px;align-items:center;font-size:13px;color:var(--text2)"></div>

    <!-- Refund Modal -->
    <div id="modal-refund" class="backdrop" style="display:none" onclick="if(event.target===this)hideModal('modal-refund')">
      <div class="modal">
        <div class="modal-hd"><h2>Refund / Cancel</h2><button class="modal-x" onclick="hideModal('modal-refund')">&#x2715;</button></div>
        <div id="refund-info" class="text2 sm mb14"></div>
        <div class="fg">
          <label>Refund Amount <span class="tip-icon" data-tip="Leave blank to refund full amount. Only works if a Stripe payment was made.">i</span></label>
          <input id="refund-amount" type="number" step="0.01" placeholder="Leave blank for full refund">
        </div>
        <div class="row mb12" style="gap:10px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
            <input type="checkbox" id="refund-cancel" checked> Cancel &amp; deactivate ticket
          </label>
        </div>
        <div id="refund-warn" class="info-box warn mb12" style="display:none;font-size:12px"></div>
        <div class="modal-ft">
          <button class="btn" onclick="hideModal('modal-refund')">Back</button>
          <button class="btn btn-danger" id="refund-btn" onclick="doRefund()">Process Refund</button>
        </div>
      </div>
    </div>

  </div></main>
</div>
<script src="/js/app.js"></script>
<script>
if (!Auth.require()) throw 0;
if (!Auth.requireAdmin()) throw 0;
renderSidebar();

let currentPage = 1, _refundId = null, _delayTimer = null;

// Load events for filter
api.admin.events().then(d => {
  const sel = document.getElementById('f-event');
  (d.events||[]).forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.id; opt.textContent = e.name;
    sel.appendChild(opt);
  });
}).catch(() => {});

function delayLoad() { clearTimeout(_delayTimer); _delayTimer = setTimeout(load, 400); }
function clearFilters() {
  document.getElementById('f-q').value = '';
  document.getElementById('f-channel').value = '';
  document.getElementById('f-event').value = '';
  load();
}

async function load(page) {
  currentPage = page || 1;
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '<div class="text2 sm">Loading…</div>';
  try {
    const params = { page: currentPage };
    const q = document.getElementById('f-q').value.trim();
    const channel = document.getElementById('f-channel').value;
    const event_id = document.getElementById('f-event').value;
    if (q) params.q = q;
    if (channel) params.channel = channel;
    if (event_id) params.event_id = event_id;

    const d = await api.admin.getTransactionsTickets(params);
    const txns = d.transactions || [];
    const total = d.total || 0;
    const pages = d.pages || 1;

    // Stats
    const totalRev = txns.reduce((s,t) => s + (t.amount_cents||0), 0);
    const withPayment = txns.filter(t => t.payment_intent_id).length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-label">Showing</div><div class="stat-val">${txns.length} of ${total}</div></div>
      <div class="stat"><div class="stat-label">Revenue (this page)</div><div class="stat-val">$${(totalRev/100).toFixed(2)}</div></div>
      <div class="stat"><div class="stat-label">With Payment</div><div class="stat-val">${withPayment}</div></div>`;

    if (!txns.length) { wrap.innerHTML = '<div class="empty"><h3>No transactions found</h3></div>'; return; }

    wrap.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>Date</th><th>Name</th><th>Email</th><th>Event</th><th>Account</th>
        <th>Level</th><th>Channel</th><th>Amount</th><th>Status</th><th>Ticket ID</th><th>Actions</th>
      </tr></thead>
      <tbody>${txns.map(t => `<tr>
        <td class="xs text2" style="white-space:nowrap">${t.created_at?.slice(0,16)||'—'}</td>
        <td><strong>${esc(t.first_name||'')} ${esc(t.last_name||'')}</strong></td>
        <td class="text2 sm">${esc(t.email||'—')}</td>
        <td class="text2 sm" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.event_name||'—')}</td>
        <td class="text2 sm">${esc(t.account_name||'—')}</td>
        <td>${t.level_name ? `<span class="badge" style="font-size:10px">${esc(t.level_name)}</span>` : '—'}</td>
        <td><span class="badge badge-${t.channel==='online'?'checked':t.channel==='phone'||t.channel==='sms'?'warn':'deactivated'}" style="font-size:10px">${esc(t.channel||'portal')}</span></td>
        <td class="mono xs">${t.amount_cents ? '$'+(t.amount_cents/100).toFixed(2) : '—'}</td>
        <td><span class="badge badge-${t.status==='checked'?'checked':t.status==='sent'?'checked':t.status==='deactivated'?'deactivated':'warn'}" style="font-size:10px">${esc(t.status||'pending')}</span></td>
        <td class="mono xs">${esc(t.ticket_id||'—')}</td>
        <td><div class="row" style="gap:4px">
          ${t.payment_intent_id ? `<button class="btn btn-sm btn-danger" onclick="openRefund('${t.id}','${esc(t.first_name||'')} ${esc(t.last_name||'')}','${t.amount_cents||0}','${t.payment_intent_id||''}')">Refund</button>` : ''}
          ${t.status !== 'deactivated' ? `<button class="btn btn-sm" onclick="cancelTicket('${t.id}')">Cancel</button>` : ''}
        </div></td>
      </tr>`).join('')}
      </tbody></table></div>`;

    // Pager
    const pager = document.getElementById('pager');
    if (pages > 1) {
      pager.innerHTML = `<button class="btn btn-sm btn-ghost" onclick="load(${currentPage-1})" ${currentPage<=1?'disabled':''}>← Prev</button>
        <span>Page ${currentPage} of ${pages} &nbsp;(${total} total)</span>
        <button class="btn btn-sm btn-ghost" onclick="load(${currentPage+1})" ${currentPage>=pages?'disabled':''}>Next →</button>`;
    } else { pager.innerHTML = ''; }
  } catch(e) { wrap.innerHTML = `<div class="info-box warn">Error: ${esc(e.message)}</div>`; }
}

function openRefund(id, name, amountCents, pi) {
  _refundId = id;
  document.getElementById('refund-info').innerHTML = `<strong>${esc(name)}</strong><br>Paid: $${(parseInt(amountCents)/100).toFixed(2)}<br><span class="xs text2 mono">${esc(pi)}</span>`;
  document.getElementById('refund-amount').value = '';
  document.getElementById('refund-warn').style.display = 'none';
  showModal('modal-refund');
}

async function doRefund() {
  const btn = document.getElementById('refund-btn');
  const warn = document.getElementById('refund-warn');
  const amtRaw = document.getElementById('refund-amount').value.trim();
  const cancel = document.getElementById('refund-cancel').checked;
  const amount_cents = amtRaw ? Math.round(parseFloat(amtRaw)*100) : undefined;
  btn.disabled = true; btn.textContent = 'Processing…';
  try {
    const d = await api.admin.refundTicket(_refundId, { cancel_ticket: cancel, amount_cents });
    if (d.error) throw new Error(d.error);
    hideModal('modal-refund');
    toast('Refund processed' + (cancel ? ' — ticket cancelled' : ''));
    load(currentPage);
  } catch(e) { warn.textContent = e.message; warn.style.display = 'block'; btn.disabled=false; btn.textContent='Process Refund'; }
}

async function cancelTicket(id) {
  if (!confirm('Cancel this ticket? The attendee will be deactivated.')) return;
  try {
    await api.admin.refundTicket(id, { cancel_ticket: true, amount_cents: 0 });
    toast('Ticket cancelled'); load(currentPage);
  } catch(e) { toast(e.message,'error'); }
}

load();
</script>
</body>
</html>
