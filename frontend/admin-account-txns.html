<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Transactions - Admin</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="page">

    <div class="ph mb16">
      <div class="ph-left">
        <h1>Account Transactions</h1>
        <p class="text2 sm">Event creation fees and platform billing payments.</p>
      </div>
    </div>

    <div id="stats" class="stat-pills mb16"></div>
    <div id="wrap"><div class="text2 sm">Loading…</div></div>

  </div></main>
</div>
<script src="/js/app.js"></script>
<script>
if (!Auth.require()) throw 0;
if (!Auth.requireAdmin()) throw 0;
renderSidebar();

async function load() {
  const wrap = document.getElementById('wrap');
  try {
    const d = await api.admin.getTransactionsAccounts();
    const txns = d.transactions || [];

    const total = txns.reduce((s,t) => s+(t.amount_cents||0), 0);
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-label">Total Payments</div><div class="stat-val">${txns.length}</div></div>
      <div class="stat"><div class="stat-label">Total Revenue</div><div class="stat-val">$${(total/100).toFixed(2)}</div></div>`;

    if (!txns.length) {
      wrap.innerHTML = `<div class="empty"><h3>No account transactions yet</h3><p class="text2">Account transactions are recorded when users pay to create events.</p></div>`;
      return;
    }

    wrap.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Account</th><th>Email</th><th>Event</th><th>Amount</th><th>Status</th><th>Stripe PI</th></tr></thead>
      <tbody>${txns.map(t=>`<tr>
        <td class="xs text2 mono">${t.created_at?.slice(0,16)||'-'}</td>
        <td><strong>${esc(t.account_name||'-')}</strong></td>
        <td class="text2 sm">${esc(t.account_email||'-')}</td>
        <td class="text2 sm">${esc(t.event_name||'-')}</td>
        <td class="mono"><strong>$${(t.amount_cents/100).toFixed(2)}</strong></td>
        <td><span class="badge badge-${t.status==='paid'?'checked':'warn'}" style="font-size:10px">${esc(t.status)}</span></td>
        <td class="mono xs">${t.stripe_payment_intent_id
          ? `<a href="https://dashboard.stripe.com/payments/${t.stripe_payment_intent_id}" target="_blank" style="color:var(--navy)">${t.stripe_payment_intent_id.slice(0,18)}…</a>`
          : '-'}</td>
      </tr>`).join('')}
      </tbody></table></div>`;
  } catch(e) { wrap.innerHTML = `<div class="info-box warn">Error: ${esc(e.message)}</div>`; }
}

load();
</script>
</body>
</html>
