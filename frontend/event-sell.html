<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sell Ticket</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://js.stripe.com/v3/"></script>
<style>
.level-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.level-row:last-child{border-bottom:none;padding-bottom:0}
.li{flex:1;min-width:0}
.lp{font-size:18px;font-weight:800;color:var(--navy);min-width:64px;text-align:right;flex-shrink:0}
.qw{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qb{width:32px;height:32px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.qb:hover{background:var(--navy);color:#fff}
.qb:disabled{border-color:#ccc;color:#ccc;cursor:default;background:#fff}
.qn{min-width:28px;text-align:center;font-weight:700;font-size:16px}
.sbox{background:var(--bg3);border-radius:var(--r);padding:13px 15px;margin-top:14px;border:1px solid var(--border)}
.srow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;color:var(--text2)}
.stotal{display:flex;justify-content:space-between;font-size:16px;font-weight:800;border-top:2px solid var(--border);margin-top:8px;padding-top:9px}
.ab{background:var(--bg3);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.at{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--navy)}
.step{display:none}.step.active{display:block}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="page">

    <div class="ph mb22">
      <div class="ph-left">
        <h1 id="ev-title">Sell Ticket</h1>
        <p id="ev-sub" class="text2"></p>
      </div>
    </div>

    <div id="cap-warning" class="info-box warn mb16" style="display:none"></div>

    <!-- Step 1: Select levels -->
    <div id="step-select" class="step active">
      <div class="card mb16">
        <div class="section-title mb12">Select Tickets</div>
        <div id="levels-list"><div class="text2 sm">Loading...</div></div>
        <div class="sbox" id="summary" style="display:none">
          <div id="summary-lines"></div>
          <div class="stotal"><span>Total</span><span id="summary-total">$0.00</span></div>
        </div>
        <div id="err-select" class="info-box warn mt12" style="display:none"></div>
        <button class="btn btn-gold mt16" id="btn-continue" onclick="goToAttendees()" style="display:none">Continue</button>
      </div>
    </div>

    <!-- Step 2: Attendee info -->
    <div id="step-attendees" class="step">
      <div class="card mb16">
        <div class="section-title mb12">Attendee Information</div>
        <div class="row mb12" style="gap:8px;align-items:center">
          <input type="checkbox" id="copy-all" onchange="toggleCopyAll()" style="width:16px;height:16px;cursor:pointer">
          <label for="copy-all" style="cursor:pointer;font-size:13px">Same phone &amp; email for all tickets</label>
        </div>
        <div id="attendee-forms"></div>
        <div id="err-attendees" class="info-box warn mt12" style="display:none"></div>
        <div class="row mt16" style="gap:10px">
          <button class="btn" onclick="goStep('step-select')" style="flex:0 0 100px;background:var(--bg3);color:var(--text);border:1.5px solid var(--border)">← Back</button>
          <button class="btn btn-gold" style="flex:1" onclick="goToPayment()">Continue to Payment</button>
        </div>
      </div>
    </div>

    <!-- Step 3: Payment -->
    <div id="step-payment" class="step">
      <div class="card mb16">
        <div class="section-title mb12">Review &amp; Pay</div>
        <div class="sbox mb16">
          <div id="payment-summary-lines"></div>
          <div class="stotal"><span>Total</span><span id="payment-total">$0.00</span></div>
        </div>
        <label>Billing Email *</label>
        <input type="email" id="billing-email" placeholder="customer@example.com" class="mb8" autocomplete="off">
        <div id="payment-element" style="margin-top:4px"></div>
        <div id="err-payment" class="info-box warn mt12" style="display:none"></div>
        <button class="btn btn-gold mt16" id="pay-btn" onclick="submitPayment()">Charge Card</button>
        <div class="row mt12" style="justify-content:center">
          <button style="background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer" onclick="goStep('step-attendees')">← Back</button>
        </div>
      </div>
    </div>

    <!-- Step 4: Success -->
    <div id="step-confirm" class="step">
      <div class="card mb16" style="text-align:center;padding:40px 24px">
        <div style="width:60px;height:60px;border-radius:50%;background:#f0fff4;border:2px solid #b2f5ca;display:flex;align-items:center;justify-content:center;margin:0 auto 18px">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#27a85f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 style="font-size:22px;font-weight:800;color:#27a85f;margin-bottom:10px">Payment Successful!</h2>
        <p style="color:var(--text2);font-size:14px;line-height:1.8">Tickets have been created and will be emailed to each attendee shortly.</p>
        <button class="btn btn-gold mt22" onclick="location.reload()">Sell Another Ticket</button>
        <button class="btn mt10" style="background:var(--bg3);color:var(--text);border:1.5px solid var(--border)" onclick="window.location='event-detail.html?id='+eventId">View Attendees</button>
      </div>
    </div>

  </div></main>
</div>

<script src="/js/app.js"></script>
<script>
if (!Auth.require()) throw 0;
renderSidebar();

const params = new URLSearchParams(location.search);
const eventId = params.get('id');
if (!eventId) window.location = '/events.html';

let eventInfo = null;
let quantities = {};
let attendeePeople = [];
let bypassCapacity = false;
let stripeObj = null;
let stripeElements = null;
let paymentElement = null;
let currentOrderId = null;

function fmt(c) { return '$' + (c/100).toFixed(2); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showErr(id, msg) { const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
function hideErr(id) { document.getElementById(id).style.display='none'; }
function goStep(id) {
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

async function load() {
  try {
    const data = await fetch(`/api/sales/portal/${eventId}`, {
      headers: { 'Authorization': `Bearer ${Auth.token()}` }
    }).then(r=>r.json());

    if (data.error) { document.getElementById('levels-list').innerHTML = `<div class="info-box warn">${esc(data.error)}</div>`; return; }

    eventInfo = data;
    document.getElementById('ev-title').textContent = data.event.name + ' - Sell Ticket';
    document.getElementById('ev-sub').textContent = [data.event.date, data.event.venue].filter(Boolean).join(' · ');
    document.title = `Sell Ticket - ${data.event.name}`;
    localStorage.setItem('hrtb_current_event_name', data.event.name);
    renderSidebar();

    // Capacity warning
    if (data.eventOverLimit) {
      const w = document.getElementById('cap-warning');
      w.style.display = 'block';
      w.innerHTML = `⚠ This event is over its capacity limit (${data.totalSold}/${data.event.max_tickets}). You can still sell tickets here - they will bypass the online limit.`;
    }

    // Build level rows
    quantities = {};
    const list = document.getElementById('levels-list');
    if (!data.levels.length) {
      list.innerHTML = '<div class="text2 sm">No ticket levels set up. Add levels in Ticket Levels first.</div>';
      return;
    }

    let html = '';
    for (const l of data.levels) {
      quantities[l.id] = 0;
      const overLimit = l.overLimit;
      html += `<div class="level-row">
        <div class="li">
          <div style="font-weight:700;font-size:14px"><span class="badge" style="background:${esc(l.color)}22;color:${esc(l.color)};border:1px solid ${esc(l.color)}44">${esc(l.name)}</span>${l.price > 0 ? '' : ' <span class="xs text2">Free</span>'}</div>
          ${l.description ? `<div class="xs text2 mt4">${esc(l.description)}</div>` : ''}
          ${overLimit ? `<div class="xs" style="color:#d97706;margin-top:3px">⚠ At limit (${l.sold}/${l.max_tickets}) - will bypass</div>` : l.available !== null ? `<div class="xs text2 mt4">${l.available} available</div>` : ''}
        </div>
        <div class="lp">${l.price > 0 ? fmt(l.price) : 'Free'}</div>
        <div class="qw">
          <button class="qb" onclick="chQty('${l.id}',-1)">−</button>
          <span class="qn" id="q-${l.id}">0</span>
          <button class="qb" onclick="chQty('${l.id}',1)">+</button>
        </div>
      </div>`;
    }
    list.innerHTML = html;
    document.getElementById('btn-continue').style.display = 'block';
  } catch(e) { document.getElementById('levels-list').innerHTML = `<div class="info-box warn">Error: ${esc(e.message)}</div>`; }
}

function chQty(id, delta) {
  const next = Math.max(0, Math.min(100, (quantities[id]||0) + delta));
  quantities[id] = next;
  document.getElementById('q-'+id).textContent = next;
  const lines = eventInfo.levels.filter(l=>quantities[l.id]>0);
  const total = lines.reduce((s,l)=>s+l.price*quantities[l.id],0);
  let html = '';
  for (const l of lines) html += `<div class="srow"><span>${esc(l.name)} × ${quantities[l.id]}</span><span>${fmt(l.price*quantities[l.id])}</span></div>`;
  document.getElementById('summary-lines').innerHTML = html;
  document.getElementById('summary-total').textContent = fmt(total);
  document.getElementById('summary').style.display = lines.length ? 'block' : 'none';
}

function goToAttendees() {
  const items = eventInfo.levels.filter(l=>quantities[l.id]>0);
  if (!items.length) { showErr('err-select','Select at least one ticket'); return; }
  hideErr('err-select');
  attendeePeople = [];
  for (const l of items) for (let j=0; j<quantities[l.id]; j++) attendeePeople.push({levelId:l.id,levelName:l.name,levelColor:l.color});

  let html = '';
  for (let i=0; i<attendeePeople.length; i++) {
    const p = attendeePeople[i];
    html += `<div class="ab"><div class="at">Ticket ${i+1} - <span class="badge" style="background:${esc(p.levelColor)}22;color:${esc(p.levelColor)};border:1px solid ${esc(p.levelColor)}44">${esc(p.levelName)}</span></div>
      <div class="form-row mb8"><div class="fg" style="margin:0"><label>First Name *</label><input id="fn-${i}" placeholder="First name" autocomplete="off"></div><div class="fg" style="margin:0"><label>Last Name *</label><input id="ln-${i}" placeholder="Last name" autocomplete="off"></div></div>
      <label>Phone <span class="xs text2">(10 digits)</span></label><input type="tel" id="ph-${i}" placeholder="5551234567" maxlength="15"${i>0?' class="cp-ph"':''}>
      <label>Email</label><input type="email" id="em-${i}" placeholder="customer@example.com"${i>0?' class="cp-em"':''}>
    </div>`;
  }
  document.getElementById('attendee-forms').innerHTML = html;
  document.getElementById('copy-all').checked = false;
  goStep('step-attendees');
}

function toggleCopyAll() {
  if (!document.getElementById('copy-all').checked || attendeePeople.length <= 1) return;
  const ph0=document.getElementById('ph-0').value, em0=document.getElementById('em-0').value;
  document.querySelectorAll('.cp-ph').forEach(el=>el.value=ph0);
  document.querySelectorAll('.cp-em').forEach(el=>el.value=em0);
  document.getElementById('ph-0').oninput=()=>document.querySelectorAll('.cp-ph').forEach(el=>el.value=document.getElementById('ph-0').value);
  document.getElementById('em-0').oninput=()=>document.querySelectorAll('.cp-em').forEach(el=>el.value=document.getElementById('em-0').value);
}

function goToPayment() {
  const people = [];
  for (let i=0; i<attendeePeople.length; i++) {
    const fn=document.getElementById('fn-'+i).value.trim();
    const ln=document.getElementById('ln-'+i).value.trim();
    const ph=document.getElementById('ph-'+i).value.trim().replace(/\D/g,'');
    const em=document.getElementById('em-'+i).value.trim();
    if (!fn) { showErr('err-attendees',`First name required for ticket ${i+1}`); return; }
    if (!ln) { showErr('err-attendees',`Last name required for ticket ${i+1}`); return; }
    people.push({...attendeePeople[i], first_name:fn, last_name:ln, phone:ph, email:em});
  }
  attendeePeople = people;
  hideErr('err-attendees');

  const items = eventInfo.levels.filter(l=>quantities[l.id]>0);
  let total=0, html='';
  for (const l of items) { total+=l.price*quantities[l.id]; html+=`<div class="srow"><span>${esc(l.name)} × ${quantities[l.id]}</span><span>${fmt(l.price*quantities[l.id])}</span></div>`; }
  document.getElementById('payment-summary-lines').innerHTML = html;
  document.getElementById('payment-total').textContent = fmt(total);
  document.getElementById('billing-email').value = people[0]?.email || '';
  goStep('step-payment');
  loadPaymentElement();
}

async function loadPaymentElement() {
  if (paymentElement) { paymentElement.destroy(); paymentElement=null; }
  document.getElementById('payment-element').innerHTML = '<div class="text2 sm" style="padding:12px 0">Loading payment form...</div>';
  hideErr('err-payment');
  document.getElementById('pay-btn').disabled = true;

  const items = eventInfo.levels.filter(l=>quantities[l.id]>0).map(l=>({levelId:l.id,quantity:quantities[l.id]}));
  const email = document.getElementById('billing-email').value.trim() || people?.[0]?.email || '';

  try {
    const res = await fetch(`/api/sales/portal/${eventId}/checkout`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${Auth.token()}` },
      body: JSON.stringify({ items, attendees: attendeePeople, email, bypassCapacity })
    }).then(r=>r.json().then(d=>({ok:r.ok,status:r.status,data:d})));

    // Capacity warning - ask to bypass
    if (res.status === 409 && res.data.error === 'CAPACITY_WARNING') {
      const msg = res.data.warnings.join('\n');
      if (confirm(`⚠ Capacity Warning\n\n${msg}\n\nSell anyway and bypass the limit?`)) {
        bypassCapacity = true;
        loadPaymentElement();
      } else {
        document.getElementById('payment-element').innerHTML = '';
        document.getElementById('pay-btn').disabled = false;
        goStep('step-select');
      }
      return;
    }

    if (!res.ok) throw new Error(res.data.error || 'Could not start payment');

    stripeObj = Stripe(res.data.publishableKey);
    stripeElements = stripeObj.elements({ clientSecret: res.data.clientSecret, appearance: { theme:'stripe', variables:{ colorPrimary:'#1a3a6b' } } });
    paymentElement = stripeElements.create('payment');
    currentOrderId = res.data.orderId;
    document.getElementById('payment-element').innerHTML = '';
    paymentElement.mount('#payment-element');
    document.getElementById('pay-btn').disabled = false;
  } catch(e) {
    document.getElementById('payment-element').innerHTML = '';
    showErr('err-payment', e.message);
    document.getElementById('pay-btn').disabled = false;
  }
}

async function submitPayment() {
  if (!stripeObj || !stripeElements) { showErr('err-payment','Payment form not ready'); return; }
  const email = document.getElementById('billing-email').value.trim();
  if (!email || !email.includes('@')) { showErr('err-payment','Please enter billing email'); return; }
  hideErr('err-payment');
  const btn = document.getElementById('pay-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Processing...';

  const { error, paymentIntent } = await stripeObj.confirmPayment({
    elements: stripeElements,
    confirmParams: { return_url: location.href + '&paid=1&order=' + currentOrderId, receipt_email: email },
    redirect: 'if_required'
  });

  if (error) {
    showErr('err-payment', error.message);
    btn.disabled = false;
    btn.textContent = 'Charge Card';
  } else if (paymentIntent?.status === 'succeeded') {
    goStep('step-confirm');
    // Poll for fulfillment
    const poll = () => fetch(`/api/sales/order/${currentOrderId}/status`).then(r=>r.json()).then(d=>{if(d.status==='pending'||d.status==='processing')setTimeout(poll,3000);}).catch(()=>{});
    poll();
  }
}

load();
</script>
</body>
</html>
