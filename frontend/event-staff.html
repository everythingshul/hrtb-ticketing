<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff List</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="page">

    <div class="ph mb16">
      <div class="ph-left">
        <h1 id="ev-title">Staff</h1>
        <p id="ev-sub" class="text2"></p>
      </div>
      <div class="ph-actions">
        <button class="btn btn-sm" onclick="doExport()">Export</button>
        <button class="btn btn-sm btn-primary" onclick="openAddStaff()">+ Add Staff</button>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="stat-pills mb16" id="stats"></div>

    <!-- Toolbar -->
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px">
      <input id="search" placeholder="Search name, email, ID…" style="width:220px" oninput="debouncedFilter()">
      <select id="level-filter" style="width:130px" onchange="filterTable()">
        <option value="">All levels</option>
      </select>
      <select id="status-filter" style="width:130px" onchange="filterTable()">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="sent">Sent</option>
        <option value="checked">Checked In</option>
        <option value="deactivated">Deactivated</option>
      </select>
      <button class="btn btn-sm btn-ghost" onclick="clearFilters()" style="font-size:11px;opacity:.7">✕ Clear</button>
      <div style="flex:1"></div>
      <span id="filter-count" class="chip" style="display:none"></span>
    </div>

    <!-- Table -->
    <div id="table-wrap"></div>

  </div></main>
</div>

<!-- Add Staff Modal -->
<div id="modal-add" class="backdrop" style="display:none" onclick="if(event.target===this)hideModal('modal-add')">
  <div class="modal">
    <div class="modal-hd"><h2>Add Staff Member</h2><button class="modal-x" onclick="hideModal('modal-add')">&#x2715;</button></div>
    <div class="form-row">
      <div class="fg"><label>First Name *</label><input id="s-fn" placeholder="Jane"></div>
      <div class="fg"><label>Last Name *</label><input id="s-ln" placeholder="Doe"></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>Phone</label><input id="s-ph" placeholder="+1 555 000 0000" type="tel"></div>
      <div class="fg"><label>Email</label><input id="s-em" type="email" placeholder="jane@example.com"></div>
    </div>
    <div class="fg">
      <label>Staff Level *</label>
      <select id="s-level"><option value="">— Select level —</option></select>
    </div>
    <div class="modal-ft">
      <button class="btn" onclick="hideModal('modal-add')">Cancel</button>
      <button class="btn btn-gold" onclick="addStaff()">Add Staff</button>
    </div>
  </div>
</div>

<!-- Send Modal -->
<div id="modal-send" class="backdrop" style="display:none" onclick="if(event.target===this)hideModal('modal-send')">
  <div class="modal">
    <div class="modal-hd"><h2>Send Staff Ticket</h2><button class="modal-x" onclick="hideModal('modal-send')">&#x2715;</button></div>
    <p class="text2 sm mb12">Sends the staff business card PDF to the email below.</p>
    <label>Send To *</label>
    <input id="send-email" type="email" placeholder="staff@example.com">
    <div class="modal-ft">
      <button class="btn" onclick="hideModal('modal-send')">Cancel</button>
      <button class="btn btn-gold" onclick="doSend()">Send Ticket</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
if (!Auth.require()) throw 0;
renderSidebar();

const params = new URLSearchParams(location.search);
const eventId = params.get('id');
if (!eventId) window.location = '/events.html';

let eventData = null, allStaff = [], filtered = [], levels = [];
let sortCol = null, sortDir = 1;
let currentSendId = null;
let _searchTimer = null;

function debouncedFilter() { clearTimeout(_searchTimer); _searchTimer = setTimeout(filterTable, 150); }

async function load() {
  const data = await api.attendees.list(eventId);
  eventData = data.event;
  levels = (data.levels || []).filter(l => l.is_staff);
  allStaff = (data.attendees || []).filter(a => a.source === 'staff');

  document.getElementById('ev-title').textContent = eventData.name + ' — Staff';
  document.getElementById('ev-sub').textContent = [eventData.date, eventData.venue].filter(Boolean).join(' · ');
  document.title = `Staff — ${eventData.name}`;
  localStorage.setItem('hrtb_current_event_name', eventData.name);
  renderSidebar();

  // Populate level filter
  const lf = document.getElementById('level-filter');
  lf.innerHTML = '<option value="">All levels</option>' + levels.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('');

  renderStats();
  filterTable();
}

function renderStats() {
  const active = allStaff.filter(a => a.status !== 'deactivated');
  const checked = allStaff.filter(a => a.status === 'checked').length;
  const sent = allStaff.filter(a => a.status === 'sent').length;

  const byLevel = levels.map(l => ({
    name: l.name, color: l.color,
    count: allStaff.filter(a => a.level_id === l.id && a.status !== 'deactivated').length
  })).filter(l => l.count > 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Total Staff</div><div class="stat-val">${active.length}</div></div>
    <div class="stat"><div class="stat-label">Checked In</div><div class="stat-val green">${checked}</div></div>
    <div class="stat"><div class="stat-label">Sent</div><div class="stat-val blue">${sent}</div></div>
    ${byLevel.map(l => `<div class="stat"><div class="stat-label" style="color:${l.color}">${esc(l.name)}</div><div class="stat-val">${l.count}</div></div>`).join('')}`;
}

function filterTable() {
  const q   = document.getElementById('search').value.toLowerCase().trim();
  const sf  = document.getElementById('status-filter').value;
  const lv  = document.getElementById('level-filter').value;

  filtered = allStaff.filter(a => {
    if (sf && a.status !== sf) return false;
    if (lv && a.level_id !== lv) return false;
    if (q && !`${a.first_name} ${a.last_name} ${a.email||''} ${a.phone||''} ${a.ticket_id}`.toLowerCase().includes(q)) return false;
    return true;
  });

  const fc = document.getElementById('filter-count');
  if (filtered.length < allStaff.length) {
    fc.style.display = 'inline-flex';
    fc.textContent = `${filtered.length} of ${allStaff.length}`;
  } else { fc.style.display = 'none'; }

  if (sortCol !== null) applySort(); else renderTable();
}

function renderTable() {
  if (!filtered.length) {
    document.getElementById('table-wrap').innerHTML = `<div class="empty"><div class="ico"></div>
      <h3>${allStaff.length ? 'No results' : 'No staff yet'}</h3>
      <p>${allStaff.length ? 'Try a different filter' : 'Add staff members using the button above. Make sure to first create a Staff level in Ticket Levels.'}</p>
    </div>`;
    return;
  }
  const cols = ['Name','Phone','Email','Level','Status','Ticket ID'];
  const arrow = i => sortCol===i ? (sortDir>0?' ↑':' ↓') : '';
  document.getElementById('table-wrap').innerHTML = `<div class="table-wrap"><table>
    <thead><tr>
      ${cols.map((c,i) => `<th style="cursor:pointer;user-select:none;white-space:nowrap" onclick="sortByCol(${i})">${c}${arrow(i)}</th>`).join('')}
      <th>Actions</th>
    </tr></thead>
    <tbody>${filtered.map(a => {
      const lvl = levels.find(l => l.id === a.level_id);
      return `<tr>
        <td style="white-space:nowrap"><strong>${esc(a.first_name||'')} ${esc(a.last_name||'')}</strong></td>
        <td class="text2 mono" style="font-size:12px">${esc(a.phone||'—')}</td>
        <td class="text2" style="font-size:12px">${esc(a.email||'—')}</td>
        <td>${lvl ? `<span class="badge" style="background:${lvl.color}22;color:${lvl.color};border:1px solid ${lvl.color}44;font-size:11px">${esc(lvl.name)}</span>` : '<span class="text3">—</span>'}</td>
        <td>${badgeHTML(a.status)}</td>
        <td class="mono" style="font-size:11px;color:var(--text2)">${esc(a.ticket_id)}</td>
        <td><div class="row" style="gap:3px;flex-wrap:nowrap">
          <button class="btn btn-sm" onclick="openSend('${a.id}','${esc(a.email||'')}')" title="Send ticket">Send</button>
          ${a.status==='pending'||a.status==='sent' ? `<button class="btn btn-sm btn-primary" onclick="checkIn('${a.id}')" title="Check In">✓ In</button>` : ''}
          ${a.status==='checked' ? `<button class="btn btn-sm" onclick="setStatus('${a.id}','pending')" title="Undo">↺</button>` : ''}
          <button class="btn btn-sm btn-danger" onclick="delStaff('${a.id}')" title="Delete">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function sortByCol(i) { sortDir = (sortCol===i) ? -sortDir : 1; sortCol = i; applySort(); }
function applySort() {
  const get = (a,i) => {
    const lvl = levels.find(l=>l.id===a.level_id);
    return [a.last_name+' '+a.first_name, a.phone||'', a.email||'', lvl?.name||'', a.status, a.ticket_id][i];
  };
  filtered.sort((a,b) => { const va=get(a,sortCol),vb=get(b,sortCol); return va<vb?-sortDir:va>vb?sortDir:0; });
  renderTable();
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('status-filter').value = '';
  document.getElementById('level-filter').value = '';
  filterTable();
}

function openAddStaff() {
  const sel = document.getElementById('s-level');
  sel.innerHTML = '<option value="">— Select level —</option>' + levels.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('');
  ['s-fn','s-ln','s-ph','s-em'].forEach(id => document.getElementById(id).value = '');
  showModal('modal-add');
}

async function addStaff() {
  const fn = document.getElementById('s-fn').value.trim();
  const ln = document.getElementById('s-ln').value.trim();
  const ph = document.getElementById('s-ph').value.trim();
  const em = document.getElementById('s-em').value.trim();
  const level_id = document.getElementById('s-level').value;
  if (!fn || !ln) { toast('First and last name required', 'error'); return; }
  if (!level_id) { toast('Select a staff level', 'error'); return; }
  try {
    const { attendee } = await api.attendees.create(eventId, { first_name: fn, last_name: ln, phone: ph||undefined, email: em||undefined, level_id });
    allStaff.push(attendee);
    hideModal('modal-add');
    toast(`${fn} ${ln} added`);
    renderStats(); filterTable();
  } catch(e) { toast(e.message, 'error'); }
}

function openSend(id, email) {
  currentSendId = id;
  document.getElementById('send-email').value = email || '';
  showModal('modal-send');
}

async function doSend() {
  const email = document.getElementById('send-email').value.trim();
  if (!email) { toast('Enter an email address', 'error'); return; }
  try {
    await api.attendees.send(currentSendId, email);
    const a = allStaff.find(x => x.id === currentSendId);
    if (a) { a.status = 'sent'; a.email = email; }
    hideModal('modal-send');
    toast('Staff ticket sent');
    renderStats(); filterTable();
  } catch(e) { toast(e.message, 'error'); }
}

async function checkIn(id) {
  try {
    await api.attendees.setStatus(id, 'checked');
    const a = allStaff.find(x => x.id === id);
    if (a) a.status = 'checked';
    renderStats(); filterTable();
  } catch(e) { toast(e.message, 'error'); }
}

async function setStatus(id, status) {
  try {
    await api.attendees.setStatus(id, status);
    const a = allStaff.find(x => x.id === id);
    if (a) a.status = status;
    renderStats(); filterTable();
  } catch(e) { toast(e.message, 'error'); }
}

async function delStaff(id) {
  const a = allStaff.find(x => x.id === id);
  if (!confirm(`Remove ${a?.first_name||'this staff member'}?`)) return;
  try {
    await api.attendees.delete(id);
    allStaff = allStaff.filter(x => x.id !== id);
    toast('Removed');
    renderStats(); filterTable();
  } catch(e) { toast(e.message, 'error'); }
}

function doExport() {
  const rows = [
    ['Ticket ID','First Name','Last Name','Phone','Email','Level','Status','Sent At','Checked In At'],
    ...filtered.map(a => {
      const lvl = levels.find(l => l.id === a.level_id);
      return [a.ticket_id, a.first_name||'', a.last_name||'', a.phone||'', a.email||'',
        lvl?.name||'', a.status, a.sent_at||'', a.checked_in_at||''];
    })
  ];
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'staff.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Exported ${filtered.length} staff`);
}

load();
</script>
</body>
</html>
